[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "algo-weaver"
version = "0.1.0"
description = "An agentic system for algorithm knowledge extraction, code reproduction, automated verification, and reusable capability accumulation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "AlgoWeaver Contributors" }]
keywords = ["agent", "algorithm", "knowledge-extraction", "code-reproduction", "langgraph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langgraph>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "litellm>=1.60,<2.0",
  "typer>=0.15,<1.0",
  "rich>=13.9,<15.0",
]

[project.optional-dependencies]
documents = ["docling>=2.0,<3.0"]
code = ["tree-sitter>=0.23,<1.0", "tree-sitter-language-pack>=0.9,<1.0"]
retrieval = ["qdrant-client>=1.12,<2.0"]
api = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]
ui = ["streamlit>=1.40,<2.0"]
observability = ["langfuse>=3.0,<4.0", "opentelemetry-api>=1.28,<2.0"]
execution = ["docker>=7.1,<8.0"]
testing = ["hypothesis>=6.100,<7.0", "pytest-benchmark>=4.0,<6.0"]

[project.scripts]
algo-weaver = "algo_weaver.cli:app"
algo-weaver-ui = "algo_weaver.ui:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algo_weaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
