services:
  api:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ALGOWEAVER_QDRANT_MODE: server
      ALGOWEAVER_QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    expose:
      - "8000"

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:6333/readyz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      ALGOWEAVER_DOMAIN: ${ALGOWEAVER_DOMAIN:-api.example.edu.cn}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_storage:
  caddy_data:
  caddy_config:
