name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
      - name: Install dependencies
        run: uv sync --group dev --extra api --extra retrieval --extra execution --extra ui
      - name: Lint
        run: uv run ruff check .
      - name: Test
        shell: bash
        run: |
          set +e
          uv run pytest --junitxml=test-results.xml
          status=$?
          if [ "$status" -ne 0 ] && [ -f test-results.xml ]; then
            uv run python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("test-results.xml").getroot()
          failures = []
          for case in root.findall(".//testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is not None:
                  failures.append((case.attrib.get("name", "unknown"), failure))
          for name, failure in failures[:5]:
              detail = " | ".join((failure.text or "").splitlines()[-8:])[:1500]
              print(f"::error title=pytest failure::{name}: {detail}")
          PY
          fi
          exit "$status"
      - name: Type check
        run: uv run mypy src
